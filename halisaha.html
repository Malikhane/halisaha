<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Halı Saha Katılım</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --grass: #1a7a3c;
    --dark: #0d2b1a;
    --mid: #163d23;
    --light-green: #2ecc71;
    --accent: #f1c40f;
    --white: #f0f8f0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Outfit', sans-serif;
    background: var(--dark);
    color: var(--white);
    min-height: 100vh;
    background-image:
      repeating-linear-gradient(
        0deg,
        transparent,
        transparent 40px,
        rgba(255,255,255,0.015) 40px,
        rgba(255,255,255,0.015) 80px
      );
  }

  header {
    background: linear-gradient(135deg, #0d2b1a 0%, #1a5c30 100%);
    border-bottom: 3px solid var(--accent);
    padding: 24px 20px 20px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  header::before {
    content: '';
    position: absolute;
    width: 300px; height: 300px;
    border: 2px solid rgba(241,196,15,0.1);
    border-radius: 50%;
    top: -150px; left: 50%;
    transform: translateX(-50%);
  }

  header h1 {
    font-family: 'Bebas Neue', cursive;
    font-size: 3rem;
    letter-spacing: 4px;
    color: var(--accent);
    text-shadow: 0 2px 20px rgba(241,196,15,0.3);
  }

  .meta {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-top: 10px;
    flex-wrap: wrap;
  }

  .meta-item {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .container {
    max-width: 860px;
    margin: 0 auto;
    padding: 28px 16px;
    display: grid;
    gap: 24px;
  }

  .card {
    background: var(--mid);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 16px;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--light-green), var(--accent));
  }

  .card-title {
    font-family: 'Bebas Neue', cursive;
    font-size: 1.4rem;
    letter-spacing: 3px;
    color: var(--accent);
    margin-bottom: 18px;
  }

  .form-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .form-group {
    flex: 1;
    min-width: 160px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  label {
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.6);
  }

  input, select, textarea {
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    padding: 12px 14px;
    color: white;
    font-family: 'Outfit', sans-serif;
    font-size: 0.95rem;
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
  }

  input:focus, select:focus, textarea:focus {
    border-color: var(--light-green);
    box-shadow: 0 0 0 3px rgba(46,204,113,0.15);
  }

  select option { background: var(--dark); }
  textarea { resize: none; height: 70px; }

  #reasonGroup { display: none; }

  .btn {
    width: 100%;
    padding: 14px;
    margin-top: 14px;
    background: linear-gradient(135deg, #27ae60, #2ecc71);
    color: white;
    font-family: 'Bebas Neue', cursive;
    font-size: 1.2rem;
    letter-spacing: 3px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 4px 20px rgba(46,204,113,0.25);
  }

  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(46,204,113,0.4);
  }

  .btn:active { transform: translateY(0); }

  .stats-row {
    display: flex;
    gap: 12px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }

  .stat-box {
    flex: 1;
    min-width: 80px;
    background: rgba(0,0,0,0.25);
    border-radius: 10px;
    padding: 12px;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.07);
  }

  .stat-num {
    font-family: 'Bebas Neue', cursive;
    font-size: 2rem;
    line-height: 1;
    color: var(--accent);
  }

  .stat-label {
    font-size: 0.7rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
    margin-top: 4px;
  }

  .participant-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }

  .participant-item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(0,0,0,0.2);
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.05);
    animation: slideIn 0.3s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .p-avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 0.9rem;
    flex-shrink: 0;
  }

  .p-avatar.coming { background: linear-gradient(135deg, #27ae60, #2ecc71); }
  .p-avatar.not-coming { background: rgba(231,76,60,0.3); color: #e74c3c; border: 1px solid rgba(231,76,60,0.4); }

  .p-name { font-weight: 600; flex: 1; }

  .p-badge {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 3px 10px;
    border-radius: 12px;
    text-transform: uppercase;
  }

  .badge-coming { background: rgba(46,204,113,0.2); color: #2ecc71; border: 1px solid rgba(46,204,113,0.3); }
  .badge-not { background: rgba(231,76,60,0.15); color: #e74c3c; border: 1px solid rgba(231,76,60,0.2); }

  .p-reason { font-size: 0.8rem; color: rgba(255,255,255,0.45); font-style: italic; }

  /* PITCH */
  .pitch-wrap {
    background: #1a7a3c;
    border-radius: 14px;
    padding: 16px;
    border: 3px solid rgba(255,255,255,0.15);
    box-shadow: inset 0 0 40px rgba(0,0,0,0.3);
    background-image:
      repeating-linear-gradient(
        90deg,
        transparent,
        transparent 50%,
        rgba(255,255,255,0.03) 50%,
        rgba(255,255,255,0.03) 100%
      );
  }

  .pitch-inner {
    display: flex;
    gap: 0;
    min-height: 200px;
    position: relative;
  }

  .pitch-inner::before {
    content: '';
    position: absolute;
    left: 50%; top: 0; bottom: 0;
    width: 2px;
    background: rgba(255,255,255,0.25);
    transform: translateX(-50%);
  }

  .pitch-inner::after {
    content: '';
    position: absolute;
    left: 50%; top: 50%;
    width: 60px; height: 60px;
    border: 2px solid rgba(255,255,255,0.2);
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }

  .team-side {
    flex: 1;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .team-label {
    font-family: 'Bebas Neue', cursive;
    font-size: 1rem;
    letter-spacing: 3px;
    margin-bottom: 6px;
    text-align: center;
    color: rgba(255,255,255,0.8);
  }

  .team-a .team-label { color: #74b9ff; }
  .team-b .team-label { color: #fd79a8; }

  .pitch-player {
    background: rgba(0,0,0,0.35);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 0.85rem;
    font-weight: 600;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(4px);
  }

  .team-a .pitch-player { border-color: rgba(116,185,255,0.3); }
  .team-b .pitch-player { border-color: rgba(253,121,168,0.3); }

  .empty-pitch {
    text-align: center;
    color: rgba(255,255,255,0.35);
    font-size: 0.85rem;
    padding: 20px;
    width: 100%;
  }

  .toast {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #27ae60;
    color: white;
    padding: 12px 24px;
    border-radius: 30px;
    font-weight: 700;
    font-size: 0.9rem;
    letter-spacing: 1px;
    transition: transform 0.3s ease;
    z-index: 999;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  .toast.show { transform: translateX(-50%) translateY(0); }

  .empty-state {
    text-align: center;
    padding: 24px;
    color: rgba(255,255,255,0.3);
    font-size: 0.9rem;
  }

  @media (max-width: 500px) {
    header h1 { font-size: 2.2rem; }
    .form-row { flex-direction: column; }
  }
</style>
</head>
<body>

<header>
  <h1>⚽ Halı Saha</h1>
  <div class="meta">
    <span class="meta-item">📍 Küçük Saha</span>
    <span class="meta-item">📅 18 Şubat 2026</span>
    <span class="meta-item">⏰ 21:00</span>
  </div>
</header>

<div class="container">

  <!-- FORM -->
  <div class="card">
    <div class="card-title">🖊 Katılım Formu</div>
    <div class="form-row">
      <div class="form-group">
        <label>Adın</label>
        <input id="name" placeholder="İsim gir..." autocomplete="off">
      </div>
      <div class="form-group">
        <label>Durum</label>
        <select id="status" onchange="toggleReason()">
          <option value="geliyor">✅ Geliyorum</option>
          <option value="gelmiyor">❌ Gelmiyorum</option>
        </select>
      </div>
    </div>
    <div class="form-group" id="reasonGroup" style="margin-top:12px;">
      <label>Neden gelemiyor?</label>
      <textarea id="reason" placeholder="Sebebini yaz..."></textarea>
    </div>
    <button class="btn" onclick="submitForm()">GÖNDER</button>
  </div>

  <!-- STATS + LIST -->
  <div class="card">
    <div class="card-title">📋 Katılım Listesi</div>
    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-num" id="statTotal">0</div>
        <div class="stat-label">Toplam</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="statComing" style="color:#2ecc71">0</div>
        <div class="stat-label">Geliyor</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="statNot" style="color:#e74c3c">0</div>
        <div class="stat-label">Gelmiyor</div>
      </div>
    </div>
    <ul class="participant-list" id="participants">
      <li class="empty-state">Henüz kimse katılmadı.</li>
    </ul>
  </div>

  <!-- TEAMS -->
  <div class="card">
    <div class="card-title">🏟 Takımlar</div>
    <div class="pitch-wrap">
      <div class="pitch-inner" id="pitchInner">
        <div class="team-side team-a">
          <div class="team-label">🔵 Takım A</div>
          <div id="teamA"><div class="empty-pitch">Oyuncu yok</div></div>
        </div>
        <div class="team-side team-b">
          <div class="team-label">🔴 Takım B</div>
          <div id="teamB"><div class="empty-pitch">Oyuncu yok</div></div>
        </div>
      </div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
  // In-memory storage (works in all environments)
  let data = [];
  let teamCounter = 0; // balanced team assignment

  function toggleReason() {
    const status = document.getElementById("status").value;
    document.getElementById("reasonGroup").style.display =
      status === "gelmiyor" ? "flex" : "none";
  }

  function showToast(msg, color = "#27ae60") {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.style.background = color;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2500);
  }

  function getInitials(name) {
    return name.split(" ").map(w => w[0]).join("").toUpperCase().slice(0, 2);
  }

  function submitForm() {
    const name = document.getElementById("name").value.trim();
    const status = document.getElementById("status").value;
    const reason = document.getElementById("reason").value.trim();

    if (!name) { showToast("⚠️ İsim girmeden olmaz!", "#e67e22"); return; }

    const alreadyExists = data.find(p => p.name.toLowerCase() === name.toLowerCase());
    if (alreadyExists) { showToast("⚠️ Bu isim zaten ekli!", "#e67e22"); return; }

    let team = null;
    if (status === "geliyor") {
      // Balanced alternating assignment
      const coming = data.filter(p => p.status === "geliyor");
      team = coming.filter(p => p.team === "A").length <= coming.filter(p => p.team === "B").length ? "A" : "B";
    }

    data.push({ name, status, reason, team });

    // Reset form
    document.getElementById("name").value = "";
    document.getElementById("reason").value = "";
    document.getElementById("status").value = "geliyor";
    toggleReason();

    showToast(status === "geliyor" ? `✅ ${name} eklendi! Takım ${team}` : `❌ ${name} gelemeyecek`);
    render();
  }

  function render() {
    const listEl = document.getElementById("participants");
    const teamAEl = document.getElementById("teamA");
    const teamBEl = document.getElementById("teamB");

    const coming = data.filter(p => p.status === "geliyor");
    const notComing = data.filter(p => p.status === "gelmiyor");

    document.getElementById("statTotal").textContent = data.length;
    document.getElementById("statComing").textContent = coming.length;
    document.getElementById("statNot").textContent = notComing.length;

    if (data.length === 0) {
      listEl.innerHTML = '<li class="empty-state">Henüz kimse katılmadı.</li>';
    } else {
      listEl.innerHTML = data.map(p => `
        <li class="participant-item">
          <div class="p-avatar ${p.status === 'geliyor' ? 'coming' : 'not-coming'}">
            ${getInitials(p.name)}
          </div>
          <span class="p-name">${p.name}</span>
          ${p.status === 'gelmiyor' && p.reason ? `<span class="p-reason">${p.reason}</span>` : ''}
          <span class="p-badge ${p.status === 'geliyor' ? 'badge-coming' : 'badge-not'}">
            ${p.status === 'geliyor' ? `Takım ${p.team}` : 'Gelmiyor'}
          </span>
        </li>
      `).join("");
    }

    const teamA = coming.filter(p => p.team === "A");
    const teamB = coming.filter(p => p.team === "B");

    teamAEl.innerHTML = teamA.length
      ? teamA.map(p => `<div class="pitch-player">⚽ ${p.name}</div>`).join("")
      : '<div class="empty-pitch">Oyuncu yok</div>';

    teamBEl.innerHTML = teamB.length
      ? teamB.map(p => `<div class="pitch-player">⚽ ${p.name}</div>`).join("")
      : '<div class="empty-pitch">Oyuncu yok</div>';
  }

  render();
</script>
</body>
</html>
